<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
</head>
<body>
   <div class="formulario">
    <h1>HealthyFit <br>Pucallpa</h1>
    <form action="">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" placeholder="Escribe tu nombre...">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Ejemplo@gmail.com">
        <label for="mensaje">Mensaje</label>
        <textarea id="mensaje" placeholder="¿Cuál es tu consulta?"></textarea>
        <button>Enviar</button>
    </form>
   </div>
   <div class="información">
    <div class="corr-tel">
        <p>Teléfono</p>
        <img src="Imagenes/TELEFONO.png" alt="">
        <p>51- 345 234 456</p>
    </div>
    <div class="corr-tel">
        <p>Correo electrónico</p>
        <img src="Imagenes/MENSAJE.png" alt="">
        <p>HealthyFit@gmail.com</p>
    </div>
   </div>
   <div class="dirección">
    <div class="ubi-cont">
        <p>Ubicación</p>
        <img src="Imagenes/UBI.png" alt="">
        <img src="Imagenes/FRASE.png" alt="">
        <p>Jr. Los Ángeles 123, Pucallpa - Ucyali</p>
        <img src="Imagenes/mapa.jpg" alt="MAPA SEDE">


    </div>

   </div>
</body>
</html>
