<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
    <link rel="stylesheet" href="estilo/estilos.css">
</head>
<body class="form_cont">
    <div class="formulario">
        <h1>HealthyFit <br> Pucallpa</h1>
        <form action="">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" placeholder="Escribe tu nomnbre...">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Ejemplo@gmail.com">
            <label for="mensaje">Mensaje</label>
            <textarea id="mensaje" placeholder="¿Cúal es tu consulta?"></textarea>
            <button>Enviar</button>
        </form>
    </div>
    <div class="informacion">
        <div class="corr-tel">
            <p>Teléfono</p>
            <img src="imagenes/iconos/TELEFONO.png" alt="">
            <p>051 - 678 497 794</p>
        </div>
        <div class="corr-tel">
            <p>Correo electrónico</p>
            <img src="imagenes/iconos/MENSAJE.png" alt="">
            <p>healthyfit@gmail.com</p>
        </div>
        <div>
             <div class="direccion">
            <div class="ubi-cont">
                <p>Ubicación</p>
                <img src="imagenes/iconos/UBI.png" alt="" class="punto-ubi">
                <img src="imagenes/contacto/FRASE.png" alt="">
                <p>Jr. Los angeles 123, Pucallpa - Ucayali</p>
            </div>
           <img src="imagenes/sedes/mapa.jpg" alt="" class="mapa-sede">
        </div>
        </div>
    </div>
</body>
</html>
